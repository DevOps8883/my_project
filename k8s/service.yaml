apiVersion: v1
kind: Service
metadata:
  name: student_pass-service
spec:
  type: NodePort               # Exposes the service outside the Minikube cluster
  selector:
    app: student_pass            # Must exactly match the label in your deployment.yaml
  ports:
    - protocol: TCP
      port: 80                # The port the service exposes inside the cluster
      targetPort: 80           # The port your Nginx container is listening on
      nodePort: 30080          # Maps the website to port 30080 on your Minikube IP

