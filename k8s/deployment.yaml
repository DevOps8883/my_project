apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-pass
  labels:
    app: student-pass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-pass
  template:
    metadata:
      labels:
        app: student-pass
      # Targets Prometheus automatically to track this pod's live network traffic
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      securityContext:
        # Grants Grafana (User 472) system permissions to write files to the volume
        fsGroup: 472
      containers:
      - name: student-pass
        # Points securely to the local internal compilation engine
        image: local/student-pass:latest 
        # Prevents Minikube from checking external networks for this asset
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 80
        volumeMounts:
        # Mounts your persistent storage directly over Grafana's internal data folder
        - name: grafana-storage
          mountPath: /var/lib/grafana
      volumes:
      # Links the container mount slot to your persistent storage claim
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
