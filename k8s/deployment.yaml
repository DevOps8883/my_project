apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-pass
  labels:
    app: student-pass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-pass
  template:
    metadata:
      labels:
        app: student-pass
      # Targets Prometheus automatically to track this pod's live network traffic
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      # Removed Grafana securityContext (fsGroup: 472) to prevent web-server permission errors
      containers:
      - name: student-pass
        # Dynamic CI/CD placeholder pointing to your web application image
        image: local/student-pass:IMAGE_TAG 
        # Forces Kubernetes to always pull the fresh image build generated by your pipeline
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 80
      # Removed accidental Grafana volumes and volumeMounts blocks entirely
