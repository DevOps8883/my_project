apiVersion: apps/v1
kind: Deployment
metadata:
  name: student_pass
  labels:
    app: student_pass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student_pass
  template:
    metadata:
      labels:
        app: student_pass
      # Targets Prometheus automatically to track this pod's live network traffic
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      containers:
      - name: student_pass
        # Points securely to the local internal compilation engine
        image: local/student_pass:latest 
        # Prevents Minikube from checking external networks for this asset
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 80
